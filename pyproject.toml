[project]
name = "cosluma"
version = "0.7.1"
description = "Windows desktop workbench for source-faithful cosplay photo finishing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
keywords = ["cosplay", "photo-editing", "image-processing", "windows"]

[project.urls]
Homepage = "https://github.com/Magnus0100/cosluma"
Repository = "https://github.com/Magnus0100/cosluma"
Issues = "https://github.com/Magnus0100/cosluma/issues"
Documentation = "https://github.com/Magnus0100/cosluma/tree/master/docs"

# Tool configuration. Install desktop dependencies from scripts/requirements-desktop.txt.
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["scripts", "tests", "providers/comfyui"]

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
