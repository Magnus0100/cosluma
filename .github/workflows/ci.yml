name: Source and desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Security-only 3.12 releases have no upstream Windows installer.
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: scripts/requirements-desktop.txt
      - run: python -m pip install -r scripts/requirements-desktop.txt
      - name: Check routine offline behavior from clean public source
        shell: pwsh
        run: |
          python -B scripts/prepare_source_release.py --output "$env:RUNNER_TEMP/cosplay-ci-source"
          if ($LASTEXITCODE -ne 0) { throw 'Public source export failed' }
          Set-Location "$env:RUNNER_TEMP/cosplay-ci-source"
          python -B tests/run.py core
          if ($LASTEXITCODE -ne 0) { throw 'Public source behavior checks failed' }
