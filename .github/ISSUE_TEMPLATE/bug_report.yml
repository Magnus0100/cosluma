name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and Windows version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, personal photos and private paths before posting.
